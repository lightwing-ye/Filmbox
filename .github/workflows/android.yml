name: build-apk

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      variant:
        description: 'assembleDebug 或 assembleRelease'
        default: 'assembleDebug'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：runner 预装的 sdkmanager 版本不匹配，
      # 它的自动接受许可步骤会以 exit 1 失败。这里直接手动接受。
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # 不用 gradle wrapper（仓库里没有二进制 jar），直接让 action 装指定版本
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle ${{ github.event.inputs.variant || 'assembleDebug' }} --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: filmmeter-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
