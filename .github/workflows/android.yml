name: build-apk

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      variant:
        description: 'assembleDebug 或 assembleRelease'
        default: 'assembleDebug'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # 不用 gradle wrapper（仓库里没有二进制 jar），直接让 action 装指定版本
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle ${{ github.event.inputs.variant || 'assembleDebug' }} --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: filmmeter-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
